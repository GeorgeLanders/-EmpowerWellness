services:
  - type: web
    name: empowerwellness-proxy
    runtime: python
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENCODE_API_KEY
        sync: false
      - key: OPENCODE_MODEL
        value: big-pickle
